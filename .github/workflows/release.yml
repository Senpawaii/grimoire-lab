name: Release

# Every push to main runs release-please. It keeps one release PR open (version bump of
# packages/core and packages/adapters, CHANGELOG.md, version.txt) built from the Conventional Commit
# titles merged since the last release. Merging that PR tags vX.Y.Z and creates the GitHub release;
# the `publish` job then builds, verifies and attaches the @grimoire/core and @grimoire/adapters
# tarballs. Nothing is published to npm.
#
# The release PR is opened with the default GITHUB_TOKEN. Its pull_request events do not need a PAT as
# long as the repo's fork-PR approval policy does not hold the bot's runs for approval (set to
# first_time_contributors_new_to_github).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Tag, both package versions and changelog agree
        run: node scripts/release-notes.mjs "${{ needs.release-please.outputs.tag_name }}" > /dev/null
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/smoke-consume.mjs
      - name: Pack @grimoire/core and @grimoire/adapters
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          pnpm --filter @grimoire/core pack --pack-destination "$RUNNER_TEMP/dist"
          pnpm --filter @grimoire/adapters pack --pack-destination "$RUNNER_TEMP/dist"
      - name: Attach tarballs (assets are never replaced)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "$RUNNER_TEMP"/dist/*.tgz
