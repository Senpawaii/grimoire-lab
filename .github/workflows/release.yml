name: Release

# Every push to main runs release-please. It keeps one release PR open (version bump of
# packages/core and packages/adapters, CHANGELOG.md, version.txt) built from the Conventional Commit
# titles merged since the last release. Merging that PR tags vX.Y.Z and creates the GitHub release;
# the `publish` job then builds, verifies and attaches the @grimoire/core and @grimoire/adapters
# tarballs. Nothing is published to npm.
#
# The release PR is opened with the default GITHUB_TOKEN. GitHub holds the pull_request CI run of a
# bot-created PR as "action_required" (needs approval), and main's required checks cannot pass until it
# runs, so the `approve-ci` step approves it. No personal access token is needed.
on:
  push:
    branches: [main]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Approve CI on the release PR
        id: approve-ci
        if: steps.rp.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRS: ${{ steps.rp.outputs.prs }}
        run: |
          # The run for the branch's *current* head only exists a few seconds after the push, and an
          # older head's run may still be waiting: match on the head commit, not just the branch.
          for branch in $(printf '%s' "$PRS" | jq -r '.[].headBranchName'); do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" -q .object.sha)
            approved=0
            for attempt in $(seq 1 24); do
              for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$sha" --event pull_request --status action_required --json databaseId -q '.[].databaseId'); do
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" && approved=1
              done
              [ "$approved" = 1 ] && break
              sleep 5
            done
            [ "$approved" = 1 ] || echo "::warning::no CI run awaiting approval for $sha on $branch"
          done

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Tag, both package versions and changelog agree
        run: node scripts/release-notes.mjs "${{ needs.release-please.outputs.tag_name }}" > /dev/null
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/smoke-consume.mjs
      - name: Pack @grimoire/core and @grimoire/adapters
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          pnpm --filter @grimoire/core pack --pack-destination "$RUNNER_TEMP/dist"
          pnpm --filter @grimoire/adapters pack --pack-destination "$RUNNER_TEMP/dist"
      - name: Attach tarballs (assets are never replaced)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" "$RUNNER_TEMP"/dist/*.tgz
