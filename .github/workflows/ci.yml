name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by the release workflow on the release-please branch: events caused by GITHUB_TOKEN
  # (such as the release PR opening) do not start workflows, but workflow_dispatch does, and its
  # check runs on the branch head satisfy main's required checks. No personal access token needed.
  workflow_dispatch:

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR title is a Conventional Commit (release-please reads the squash-merge title)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|deps|revert|docs|chore|ci|test|build|refactor|style)(\([a-z0-9_-]+\))?!?: .+'; then
            echo "::error::PR title must look like 'fix(scope): summary' or 'feat: summary' (got: $TITLE)"
            exit 1
          fi

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
      - run: node scripts/smoke-consume.mjs

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Coverage of changed files must be at least 90%
        run: node scripts/coverage-changed.mjs origin/${{ github.base_ref || 'main' }}
