version: 2
updates:
  # Root devDependencies and every workspace package (pnpm-lock.yaml is handled by the npm ecosystem).
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/Lisbon

  # Actions pinned in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/Lisbon
