version: 2
updates:
  # Root devDependencies and every workspace package (pnpm-lock.yaml is handled by the npm ecosystem).
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/Lisbon
    # Runtime dependency updates change what consumers get, so they release (release-please: fix).
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope

  # Actions pinned in .github/workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "07:00"
      timezone: Europe/Lisbon
    commit-message:
      prefix: ci
